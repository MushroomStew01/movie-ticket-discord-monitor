name: Movie Ticket Monitor

run-name: Movie Ticket Monitor — ${{ github.event_name }}

on:
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Send a Discord connection test before monitoring"
        required: false
        type: boolean
        default: false
  schedule:
    # GitHub scheduled workflows are best-effort. These off-hour minutes reduce
    # contention, but they do not guarantee an exact ten-minute interval.
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

concurrency:
  group: movie-ticket-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Show trigger information
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Branch: ${{ github.ref }}"
          echo "UTC time: $(date -u)"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate configuration
        run: python monitor.py --validate-config

      - name: Test Discord when requested
        if: github.event_name == 'workflow_dispatch' && inputs.send_test_alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: python monitor.py --test-alert

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          set +e
          python monitor.py
          code=$?
          echo "MONITOR_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Upload failure diagnostics
        if: always() && env.MONITOR_EXIT_CODE != '0'
        uses: actions/upload-artifact@v6
        with:
          name: cineplex-failure-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save meaningful monitor state
        run: |
          if git diff --quiet -- state.json; then
            echo "No meaningful state changes to commit."
            exit 0
          fi

          git config user.name "movie-ticket-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "Update movie monitor state"

          if ! git push; then
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Fail workflow on any target or delivery failure
        run: |
          code="${MONITOR_EXIT_CODE:-1}"
          if [ "$code" -ne 0 ]; then
            echo "Monitor returned exit code $code."
            exit "$code"
          fi
