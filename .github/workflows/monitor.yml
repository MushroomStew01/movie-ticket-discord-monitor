name: Movie Ticket Monitor

on:
  workflow_dispatch:
  schedule:
    # At minutes 2, 7, 12, etc. Avoids the busiest exact top-of-hour time.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: movie-ticket-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          set +e
          python monitor.py
          code=$?
          echo "MONITOR_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Save monitor state
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes to commit."
            exit 0
          fi

          git config user.name "movie-ticket-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "Update movie monitor state"
          git push

      - name: Fail workflow if every target failed
        if: env.MONITOR_EXIT_CODE == '1'
        run: exit 1
